<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff5a1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cofrinho">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Cofrinho — Controle Financeiro</title>
<style>
/* ==========================================================================
   TOKENS DE DESIGN, TEMAS CLARO/ESCURO E SAFE-AREAS
   ========================================================================== */
:root {
  --bg: #ffffff;
  --card: #f2f2f2;
  --ink: #111111;
  --mut: #777777;
  --acc: #ff5a1f;
  --bi: #ffffff;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0d0d;
    --card: #1c1c1c;
    --ink: #f4f4f4;
    --mut: #9a9a9a;
    --bi: #111111;
  }
}

:root[data-theme="dark"] {
  --bg: #0d0d0d;
  --card: #1c1c1c;
  --ink: #f4f4f4;
  --mut: #9a9a9a;
  --bi: #111111;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow-x: clip;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--acc);
  outline-offset: 2px;
}

#app {
  max-width: 430px;
  width: 100%;
  margin: 0 auto;
  padding: 16px 18px 124px;
  min-height: 100dvh;
  position: relative;
  touch-action: pan-y pinch-zoom;
  overflow-x: clip;
}

#app[data-v]:not([data-v="home"]):not([data-v="onb"]) {
  padding-top: 72px;
}

#app h2 {
  text-align: center;
  margin: 0 0 10px;
  min-height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
}

h2 {
  margin: 6px 0 4px;
}

.pill {
  background: var(--card);
  border-radius: 99px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ==========================================================================
   TOPO FIXO, SELETOR DE MÊS E BOTÕES SUPERIORES
   ========================================================================== */
body:before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: calc(70px + env(safe-area-inset-top, 0px));
  background: linear-gradient(var(--bg) 72%, transparent);
  z-index: 15;
  pointer-events: none;
}

.mon {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--card);
  border-radius: 99px;
  padding: 6px;
  width: 210px;
  font-weight: 600;
  text-transform: capitalize;
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  left: 50%;
  margin: 0 0 0 -105px;
  z-index: 18;
  border: 1px solid color-mix(in srgb, var(--ink) 8%, transparent);
}

.mon button {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 0;
  background: var(--bg);
  font-size: 18px;
  cursor: pointer;
  display: grid;
  place-items: center;
  line-height: 1;
  padding: 0;
  flex: none;
}

.mon + .bub,
.mon + .bubs {
  margin-top: 74px;
}

.mon .mini {
  position: fixed;
  top: calc(66px + env(safe-area-inset-top, 0px));
  right: max(18px, calc(50% - 197px));
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--card);
  padding: 0;
  border: 0;
  opacity: 0;
  pointer-events: none;
  transform: scale(0.6);
  transition: opacity 0.25s, transform 0.25s;
  z-index: 18;
  cursor: pointer;
}

.mon .mini.on {
  opacity: 1;
  transform: none;
  pointer-events: auto;
}

.mini .pm {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -42%);
}

.av {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  right: max(18px, calc(50% - 197px));
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid color-mix(in srgb, var(--ink) 8%, transparent);
  background: var(--card);
  display: grid;
  place-items: center;
  overflow: hidden;
  cursor: pointer;
  padding: 0;
  color: var(--ink);
  z-index: 18;
}

.av.pt {
  right: calc(max(18px, calc(50% - 197px)) + 52px);
}

.av.bk {
  right: auto;
  left: max(18px, calc(50% - 197px));
}

.av .pm {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -42%);
}

.av img, .ph img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.ph {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  background: var(--card);
  display: grid;
  place-items: center;
  overflow: hidden;
}

.ph svg {
  width: 40px;
  height: 40px;
}

/* ==========================================================================
   BALÕES, ANEL PRINCIPAL E SOMBRA DO PET NO CHÃO
   ========================================================================== */
.bub {
  position: relative;
  background: var(--card);
  color: var(--ink);
  border: 1px solid color-mix(in srgb, var(--ink) 8%, transparent);
  border-radius: 14px;
  padding: 8px 12px;
  font-size: 13px;
  line-height: 1.35;
  margin: 0 8px 10px;
  text-align: left;
}

.bub small {
  font-size: 12px;
  color: var(--mut);
}

.bub:after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -6px;
  width: 10px;
  height: 10px;
  background: var(--card);
  border-right: 1px solid color-mix(in srgb, var(--ink) 8%, transparent);
  border-bottom: 1px solid color-mix(in srgb, var(--ink) 8%, transparent);
  transform: translateX(-50%) rotate(45deg);
}

button.bub {
  border: 1px solid color-mix(in srgb, var(--ink) 8%, transparent);
  display: block;
  width: calc(100% - 16px);
  cursor: pointer;
  animation: pulse 2.4s ease-in-out infinite;
}

@keyframes pulse {
  50% { transform: scale(1.01); }
}

.bubs {
  display: grid;
}

.bubs > .bub {
  grid-area: 1/1;
  align-self: stretch;
  display: flex;
  flex-direction: column;
  justify-content: center;
  opacity: 0;
  filter: blur(2px);
  translate: 0 6px;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.45s ease, filter 0.45s ease, translate 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s 0.45s;
}

.bubs > .bub.on {
  opacity: 1;
  filter: blur(0);
  translate: 0 0;
  visibility: visible;
  pointer-events: auto;
  transition-delay: 0s;
}

.ring {
  position: relative;
  width: 260px;
  height: 230px;
  margin: 0 auto;
  overflow: visible;
}

.ring svg.r {
  position: absolute;
  inset: 0;
  overflow: visible;
}

.ring .m {
  position: absolute;
  left: 50%;
  top: 96px;
  margin-left: -44px;
  width: 88px;
  pointer-events: none;
  z-index: 2;
}

/* Sombra fixa no chão sob o pet (não gira com .m) */
.ring .pet-sh {
  position: absolute;
  left: 50%;
  top: 171px;
  width: 58px;
  height: 9px;
  margin-left: -29px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 1;
  background: radial-gradient(ellipse at center, color-mix(in srgb, var(--ink) 26%, transparent) 0%, color-mix(in srgb, var(--ink) 9%, transparent) 58%, transparent 100%);
  filter: blur(2.2px);
  transition: transform 0.28s ease, opacity 0.28s ease;
}

.ring:has(.pet.happy) .pet-sh {
  animation: shadowJump 0.8s ease-in-out infinite;
}

.ring:has(.m.hop) .pet-sh {
  animation: shadowHop 0.6s ease-in-out;
}

.ring:has(.pet.smart) .pet-sh {
  animation: shadowSmart 2.2s ease-in-out infinite;
}

@keyframes shadowJump {
  0%, 100% { transform: scale(1.06, 1); opacity: 0.95; }
  45%, 55% { transform: scale(0.74, 0.85); opacity: 0.48; }
}

@keyframes shadowHop {
  0%, 100% { transform: scale(1); opacity: 0.92; }
  40% { transform: scale(0.72, 0.84); opacity: 0.46; }
}

@keyframes shadowSmart {
  0%, 100% { transform: scale(1); opacity: 0.9; }
  20% { transform: scale(0.84, 0.9); opacity: 0.62; }
  60% { transform: scale(0.92, 0.95); opacity: 0.76; }
}

.lbl {
  text-align: center;
  color: var(--mut);
  margin-top: 6px;
}

.big {
  text-align: center;
  font-size: 52px;
  font-weight: 800;
  letter-spacing: -2px;
  line-height: 1.1;
}

.big small {
  font-size: 24px;
  letter-spacing: 0;
}

.sub {
  text-align: center;
  color: var(--mut);
  font-size: 14px;
}

.st {
  display: block;
  width: max-content;
  margin: 12px auto 22px;
  background: var(--card);
  border-radius: 99px;
  padding: 6px 14px;
  font-size: 14px;
  font-weight: 600;
}

.acts {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  text-align: center;
  font-size: 14px;
}

.acts button {
  background: none;
  border: 0;
  cursor: pointer;
  display: grid;
  justify-items: center;
  gap: 6px;
}

.acts i {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--card);
  display: grid;
  place-items: center;
  transition: transform 0.15s ease;
}

.acts button:active i {
  transform: scale(0.9);
}

svg.ic {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  display: block;
  flex: none;
}

.card {
  background: var(--card);
  border-radius: 22px;
  padding: 16px;
  margin-top: 22px;
}

.card h4 {
  margin: 0 0 10px;
}

.row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 0;
  border-top: 1px solid color-mix(in srgb, var(--ink) 10%, transparent);
}

.row:first-of-type {
  border-top: 0;
}

.row em {
  font-style: normal;
  color: var(--mut);
  font-size: 13px;
  display: block;
}

.row button {
  border: 0;
  background: none;
  color: var(--mut);
  cursor: pointer;
  font-size: 18px;
}

/* ==========================================================================
   BARRAS DE GASTOS / PROGRESSO COM GLOW DISCRETO E SEM CORTES
   ========================================================================== */
.bar {
  height: 10px;
  border-radius: 9px;
  background: var(--acc);
  margin-top: 6px;
  box-shadow: 0 0 10px -1px color-mix(in srgb, var(--acc) 36%, transparent);
}

.gb {
  display: block;
  width: 100%;
  height: 10px;
  border-radius: 9px;
  background: color-mix(in srgb, var(--ink) 14%, transparent);
  overflow: visible;
  margin-top: 8px;
  position: relative;
}

.gb > i {
  display: block;
  height: 100%;
  min-width: 0;
  border-radius: 9px;
  background: #3d63b8;
  box-shadow: 0 0 9px -1px color-mix(in srgb, currentColor 36%, #3d63b8 32%);
  transition: width 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.gb.thin {
  height: 5px;
  margin-top: 6px;
}

.gb.thin > i {
  box-shadow: 0 0 7px -1px color-mix(in srgb, #3d63b8 38%, transparent);
}

.gb.big {
  position: relative;
  height: 14px;
  margin-top: 12px;
}

.gb.big > i {
  box-shadow: 0 0 10px -1px color-mix(in srgb, #3d63b8 38%, transparent);
}

.gb.big:after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 9px;
  pointer-events: none;
  background: repeating-linear-gradient(90deg, transparent 0 calc(25% - 2px), var(--card) calc(25% - 2px) 25%);
}

.mprog .gb {
  height: 6px;
  margin-top: 6px;
}

.stk {
  display: flex;
  height: 12px;
  border-radius: 9px;
  overflow: hidden;
  background: color-mix(in srgb, var(--ink) 12%, transparent);
  padding: 1px;
  gap: 1px;
}

.stk span {
  display: block;
  height: 100%;
  border-radius: 9px;
}

.stk span {
  display: block;
  height: 100%;
  border-radius: 9px;
  box-shadow: 0 0 8px -1px currentColor;
}

.rs-over {
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, #e5342b 55%, transparent), 0 0 18px -6px color-mix(in srgb, #e5342b 32%, transparent);
}

.rsbr {
  display: block;
  height: 6px;
  border-radius: 9px;
  background: color-mix(in srgb, var(--ink) 12%, transparent);
  overflow: visible;
  margin-top: 8px;
}

.rsbr i {
  display: block;
  height: 100%;
  border-radius: 9px;
  background: var(--c);
  box-shadow: 0 0 8px -1px color-mix(in srgb, var(--c) 42%, transparent);
}

/* ==========================================================================
   NAVEGAÇÃO INFERIOR E MODAIS / SHEETS
   ========================================================================== */
.nav {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex;
  gap: 8px;
  align-items: center;
  background: color-mix(in srgb, var(--card) 88%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-radius: 99px;
  padding: 8px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
  z-index: 40;
}

.nav button {
  width: 44px;
  height: 46px;
  border-radius: 99px;
  border: 0;
  background: none;
  cursor: pointer;
  display: grid;
  place-items: center;
  padding: 0;
  position: relative;
  transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.nav button:active {
  transform: scale(0.88);
}

.nav svg {
  display: block;
}

.nav button.on {
  background: var(--bg);
  color: var(--acc);
}

.nav button.on:after {
  content: "";
  position: absolute;
  bottom: 4px;
  left: 50%;
  width: 5px;
  height: 5px;
  margin-left: -2.5px;
  border-radius: 50%;
  background: var(--acc);
}

.nav .plus {
  background: var(--ink);
  color: var(--bg);
  width: 54px;
  height: 54px;
  border-radius: 50%;
}

#sheet {
  display: none;
}

#sheet.on {
  display: block;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  z-index: 20;
  animation: dimin 0.35s both;
}

#sheet.on.out {
  animation: dimout 0.4s both;
}

#sheet.on:has(.sh.kp) {
  background: rgba(0, 0, 0, 0.28);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
}

@keyframes dimin {
  from { background: rgba(0, 0, 0, 0); -webkit-backdrop-filter: blur(0); backdrop-filter: blur(0); }
}

@keyframes dimout {
  to { background: rgba(0, 0, 0, 0); -webkit-backdrop-filter: blur(0); backdrop-filter: blur(0); }
}

.sh {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  width: calc(100% - 24px);
  max-width: 406px;
  margin: auto;
  background: var(--bg);
  border-radius: 26px;
  padding: 18px 16px;
  display: grid;
  gap: 10px;
  max-height: 85vh;
  overflow: auto;
  animation: up 0.2s ease-out;
}

@keyframes up {
  from { transform: translateY(40px); opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .sh { animation: none; }
}

.sh h3 {
  margin: 0;
  font-size: 17px;
}

input, select, textarea {
  background: var(--card);
  border: 0;
  border-radius: 14px;
  padding: 13px 14px;
  width: 100%;
}

textarea {
  min-height: 130px;
  font: 12px monospace;
}

.ent-meta {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 6px;
  align-items: center;
}

.ent-meta input {
  padding: 7px 10px;
  font-size: 12px;
  border-radius: 11px;
  min-width: 0;
}

.dt-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--card);
  border: 0;
  border-radius: 11px;
  padding: 7px 10px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  color: var(--ink);
}

.dt-btn svg.ic {
  width: 15px;
  height: 15px;
  color: var(--acc);
}

/* ==========================================================================
   CALENDÁRIO COMPACTO COM PÍLULAS SEPARADAS DE MÊS E ANO
   ========================================================================== */
.cal-box {
  background: var(--card);
  border-radius: 16px;
  padding: 10px;
}

.cal-hd {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-bottom: 8px;
}

.cal-pill {
  display: grid;
  grid-template-columns: 24px 1fr 24px;
  align-items: center;
  background: var(--bg);
  border-radius: 99px;
  padding: 2px;
  height: 30px;
  font-weight: 700;
  font-size: 12px;
  text-align: center;
  border: 1px solid color-mix(in srgb, var(--ink) 8%, transparent);
}

.cal-pill.m-p {
  flex: 1;
  min-width: 0;
}

.cal-pill.y-p {
  width: 96px;
  flex: none;
}

.cal-pill span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 0 2px;
}

.cal-pill button {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 0;
  background: var(--card);
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 14px;
  line-height: 1;
  padding: 0;
  color: var(--ink);
}

.cal-pill button:active {
  transform: scale(0.9);
}

.cal-wk {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  font-size: 10px;
  color: var(--mut);
  font-weight: 600;
  margin-bottom: 2px;
}

.cal-gd {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}

.cal-d {
  height: 28px;
  border: 0;
  background: none;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: grid;
  place-items: center;
  color: var(--ink);
  position: relative;
  padding: 0;
  transition: background 0.15s, color 0.15s, transform 0.12s;
}

.cal-d:active {
  transform: scale(0.9);
}

.cal-d.mut {
  color: var(--mut);
  opacity: 0.4;
}

.cal-d.tod {
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--ink) 35%, transparent);
}

.cal-d.in {
  background: color-mix(in srgb, var(--acc) 18%, transparent);
  border-radius: 5px;
}

.cal-d.sel, .cal-d.s1, .cal-d.s2 {
  background: var(--acc);
  color: #ffffff;
  border-radius: 8px;
  font-weight: 800;
}

.cal-ft {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px solid color-mix(in srgb, var(--ink) 8%, transparent);
  font-size: 11px;
}

.cal-ft button {
  border: 0;
  border-radius: 99px;
  padding: 5px 10px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}

.cal-ft .c-sec {
  background: var(--bg);
  color: var(--ink);
}

.cal-ft .c-pri {
  background: var(--ink);
  color: var(--bg);
}

.kp-blur {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.32);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-radius: 26px;
  z-index: 25;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}

.kp-blur.on {
  opacity: 1;
  pointer-events: auto;
}

.cal-float {
  position: absolute;
  left: 14px;
  right: 14px;
  top: 116px;
  margin: auto;
  max-width: 274px;
  z-index: 30;
  background: var(--bg);
  border: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
  border-radius: 20px;
  padding: 10px;
  box-shadow: 0 14px 36px rgba(0, 0, 0, 0.32);
  transform-origin: top left;
  animation: calPopIn 0.22s cubic-bezier(0.2, 0.85, 0.25, 1) both;

function buildConfettiHtml(onRing = false) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return '';
  const colors = ['#ff5a1f', '#2fa84f', '#2f6fdb', '#f2b705', '#a05be8', '#ff85a1'];
  const pieces = [];
  const count = onRing ? 34 : 42;
  for (let i = 0; i < count; i++) {
    const cx = onRing ? (18 + Math.random() * 64).toFixed(1) + '%' : (6 + Math.random() * 88).toFixed(1) + '%';
    const cstartY = onRing ? '76px' : '-14px';
    const cw = (6 + Math.random() * 5.5).toFixed(1) + 'px';
    const ch = (4 + Math.random() * 4.5).toFixed(1) + 'px';
    const cr = Math.random() > 0.45 ? '2px' : '99px';
    const cc = colors[i % colors.length];
    const cd = (1.1 + Math.random() * 0.85).toFixed(2) + 's';
    const delay = (Math.random() * 0.24).toFixed(2) + 's';
    const cdx = onRing ? ((Math.random() - 0.5) * 165).toFixed(0) + 'px' : ((Math.random() - 0.5) * 140).toFixed(0) + 'px';
    const cdy = onRing ? (-28 - Math.random() * 65).toFixed(0) + 'px' : (75 + Math.random() * 22).toFixed(0) + 'vh';
    const crot = ((Math.random() > 0.5 ? 1 : -1) * (360 + Math.random() * 480)).toFixed(0) + 'deg';
    pieces.push(`<span class="confetti-pc" style="--cstart-y:${cstartY};--cx:${cx};--cw:${cw};--ch:${ch};--cr:${cr};--cc:${cc};--cd:${cd};--cdelay:${delay};--cdx:${cdx};--cdy:${cdy};--crot:${crot}"></span>`);
  }
  return `<div class="confetti-layer" aria-hidden="true">${pieces.join('')}</div>`;
}

function launchConfetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const ring = document.querySelector('.ring');
  const old = document.querySelectorAll('.confetti-layer');
  old.forEach((el) => el.remove());
  if (ring) {
    ring.insertAdjacentHTML('beforeend', buildConfettiHtml(true));
    const el = ring.querySelector('.confetti-layer');
    setTimeout(() => { if (el) el.remove(); }, 2200);
    return;
  }
  const layer = document.createElement('div');
  layer.className = 'confetti-layer';
  layer.setAttribute('aria-hidden', 'true');
  layer.innerHTML = buildConfettiHtml(false).replace(/^<div[^>]*>|<\/div>$/g, '');
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 2450);
}

function showAdvanceCelebration(itemName, amount, leftCount, totalCount) {
  const detail = leftCount > 0
    ? `Você adiantou ${brl(amount)} de “${esc(itemName)}” — restam ${leftCount} de ${totalCount} parcelas.`
    : `Você quitou a última parcela de “${esc(itemName)}” (${totalCount}/${totalCount})!`;
  cheerState = {
    title: 'Parcela adiantada! 🎉',
    detail,
    until: Date.now() + 8000,
    confettiAt: Date.now()
  };
  view = 'home';
  off = 0;
  render();
  setTimeout(() => launchConfetti(), 60);
  clearTimeout(showAdvanceCelebration.t);
  clearTimeout(endCheer.t);
  showAdvanceCelebration.t = setTimeout(endCheer, 7000);
}

function endCheer() {
  const st = cheerState;
  if (!st || st.ending) return;
  clearTimeout(showAdvanceCelebration.t);
  const app = document.querySelector('#app');
  const still = view === 'home' && app && app.querySelector('.m .pet.cheer');
  if (!still || matchMedia('(prefers-reduced-motion: reduce)').matches) {
    cheerState = null;
    if (view === 'home') render();
    return;
  }
  st.ending = true;
  app.querySelectorAll(':scope > .bub, :scope > .bubs, .m .pet').forEach((e) => e.classList.add('cheer-out'));
  clearTimeout(endCheer.t);
  endCheer.t = setTimeout(() => {
    if (cheerState !== st) return;
    cheerState = null;
    if (view !== 'home') return;
    render();
    markCheerEnd();
  }, 420);
}

function markCheerEnd() {
  const app = document.querySelector('#app');
  if (!app) return;
  const els = [...app.querySelectorAll(':scope > .bub, :scope > .bubs, .m .pet, .ring .r, span.st')];
  els.forEach((e) => e.classList.add('cheer-in'));
  setTimeout(() => els.forEach((e) => e.classList.remove('cheer-in')), 1000);
}

function dismissAdvanceCelebration() {

function syncExclRate(c) {
  const pct = c && c.base > 0 ? Math.max(0, (c.sobra / c.base) * 100) : 100;

}

function getAutoBak() {
  try {
    const raw = localStorage.getItem(AK);
    if (!raw) return { enabled: false, lastAt: '', snapshot: '' };
    return Object.assign({ enabled: false, lastAt: '', snapshot: '' }, JSON.parse(raw));
  } catch (err) {
    return { enabled: false, lastAt: '', snapshot: '' };
  }
}

function setAutoBakMeta(meta) {
  try {
    localStorage.setItem(AK, JSON.stringify(meta));
  } catch (err) {}
}

function runAutoBackup(force = false) {
  const ab = getAutoBak();
  if (!ab.enabled && !force) return;
  const now = new Date();
  const stamp = now.toLocaleDateString('pt-BR') + ' às ' + now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const snap = JSON.stringify({
    onb: S.onb,
    limite: S.limite,
    moeda: S.moeda || 'BRL',
    tema: S.tema,
    nome: S.nome,
    email: S.email,
    foto: S.foto,
    meta: S.meta,
    gp: S.gp,
    tx: S.tx,
    fixos: S.fixos
  });
  setAutoBakMeta({
    enabled: !!ab.enabled,
    lastAt: stamp,
    snapshot: snap
  });
}

function togAutoBak() {
  const ab = getAutoBak();
  const next = !ab.enabled;
  setAutoBakMeta({
    enabled: next,
    lastAt: ab.lastAt,
    snapshot: ab.snapshot
  });
  if (next) {
    runAutoBackup(true);
    toast('Backup automático ativado');
  } else {
    toast('Backup automático desativado');
  }
  render();
}

function restoreAutoBak() {
  const ab = getAutoBak();
  if (!ab.snapshot) {
    toast('Nenhum backup automático salvo ainda');
    return;
  }
  try {
    const o = JSON.parse(ab.snapshot);
    if (!Array.isArray(o.tx)) throw new Error('Snapshot inválido');
    const keepAuto = ab.enabled;
    const keepAt = ab.lastAt;
    const keepSnap = ab.snapshot;
    S = Object.assign({ onb: 1, limite: 1000, tx: [], fixos: [] }, o);
    localStorage.setItem(K, JSON.stringify(S));
    setAutoBakMeta({ enabled: keepAuto, lastAt: keepAt, snapshot: keepSnap });
    view = 'home';
    render();
    toast('Backup automático restaurado');
  } catch (err) {
    toast('Falha ao restaurar backup automático');
  }
}

function downloadBakFile() {
  try {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `cofrinho-backup-${today()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Arquivo de backup baixado');
  } catch (err) {
    toast('Não foi possível baixar o arquivo');
  }
}

function calc() {
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() + off);
  const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  const dm = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  const now = new Date();
  const cur = off === 0;
  const t = S.tx.filter((x) => x.d.startsWith(k)).sort((a, b) => b.d.localeCompare(a.d) || b.id - a.id);
  const sum = (a) => a.reduce((s, x) => s + x.v, 0);
  const g = sum(t.filter((x) => x.t === 'g'));
  const r = sum(t.filter((x) => x.t === 'r'));
  const f = sum(S.fixos.filter((x) => fxOn(x, k)));
  return {
    d, k, t, g, r, f,
    gast: g + f,
    sobra: S.limite + r - g - f,
    base: S.limite + r,
    cur,
    left: cur ? dm - now.getDate() + 1 : dm,
    ritmo: cur ? (S.limite * now.getDate()) / dm : S.limite
  };
}

const CT = {
  g: [['Mercado', 'cart'], ['Comida', 'food'], ['Transporte', 'car'], ['Lazer', 'party'], ['Saúde', 'heart'], ['Casa', 'home'], ['Outros', 'dots']],
  r: [['Salário', 'wal'], ['Extra', 'plus'], ['Outros', 'dots']],
  x: [['Aluguel', 'home'], ['Luz', 'bulb'], ['Água', 'water'], ['Internet', 'wifi'], ['Cartão de crédito', 'card'], ['Gás', 'flame'], ['Celular', 'phone'], ['Condomínio', 'build'], ['Streaming', 'play'], ['Plano de saúde', 'heart'], ['Escola', 'book'], ['Outros', 'dots']]
};

let calSt = { mode: 'single', y: 0, m: 0, d1: '', d2: '', tmp1: '', tmp2: '' };

function buildCalHtml() {
  const y = calSt.y, m = calSt.m;
  const first = new Date(y, m, 1);
  const startW = first.getDay();
  const daysInM = new Date(y, m + 1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();
  const moRaw = first.toLocaleDateString('pt-BR', { month: 'long' });
  const moName = moRaw[0].toUpperCase() + moRaw.slice(1);
  const td = today();
  const pad = (n) => String(n).padStart(2, '0');
  const iso = (yy, mm, dd) => `${yy}-${pad(mm + 1)}-${pad(dd)}`;

  const cells = [];
  for (let i = startW - 1; i >= 0; i--) {
    const pm = m === 0 ? 11 : m - 1;
    const py = m === 0 ? y - 1 : y;
    const dd = prevDays - i;
    cells.push({ iso: iso(py, pm, dd), d: dd, mut: true });
  }
  for (let dd = 1; dd <= daysInM; dd++) {
    cells.push({ iso: iso(y, m, dd), d: dd, mut: false });
  }
  while (cells.length % 7 !== 0) {
    const nm = m === 11 ? 0 : m + 1;
    const ny = m === 11 ? y + 1 : y;
    const dd = cells.length - (startW + daysInM) + 1;
    cells.push({ iso: iso(ny, nm, dd), d: dd, mut: true });
  }

  const sel1 = calSt.mode === 'single' ? calSt.d1 : calSt.tmp1;
  const sel2 = calSt.mode === 'single' ? '' : calSt.tmp2;
  const lo = sel1 && sel2 ? (sel1 <= sel2 ? sel1 : sel2) : sel1;
  const hi = sel1 && sel2 ? (sel1 <= sel2 ? sel2 : sel1) : '';
  const wk = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];

  const gridHtml = cells.map((c) => {
    const cls = ['cal-d'];
    if (c.mut) cls.push('mut');
    if (c.iso === td) cls.push('tod');
    if (calSt.mode === 'single') {
      if (c.iso === sel1) cls.push('sel');
    } else {
      if (c.iso === sel1) cls.push('s1');
      if (c.iso === sel2) cls.push('s2');
      if (lo && hi && c.iso > lo && c.iso < hi) cls.push('in');
    }
    return `<button type="button" class="${cls.join(' ')}" onclick="calPick('${c.iso}')">${c.d}</button>`;
  }).join('');

  const ftHtml = calSt.mode === 'single'
    ? `<div class="cal-ft"><button type="button" class="c-sec" onclick="calPick('${td}')">Hoje</button><button type="button" class="c-pri" onclick="calToggleSingle()">Concluir</button></div>`
    : `<div class="cal-ft"><button type="button" class="c-sec" onclick="calClearRng()">Limpar</button><button type="button" class="c-pri" onclick="calApplyRng()">Aplicar</button></div>`;

  return `<div class="cal-box">
    <div class="cal-hd">
      <div class="cal-pill m-p"><button type="button" onclick="calNavM(-1)" aria-label="Mês anterior">‹</button><span>${moName}</span><button type="button" onclick="calNavM(1)" aria-label="Próximo mês">›</button></div>
      <div class="cal-pill y-p"><button type="button" onclick="calNavY(-1)" aria-label="Ano anterior">‹</button><span>${y}</span><button type="button" onclick="calNavY(1)" aria-label="Próximo ano">›</button></div>
    </div>
    <div class="cal-wk">${wk.map((w) => `<span>${w}</span>`).join('')}</div>
    <div class="cal-gd">${gridHtml}</div>
    ${ftHtml}
  </div>`;
}

function calRedraw() {
  const el = $('.cal-box');
  if (el) {
    const t = document.createElement('div');
    t.innerHTML = buildCalHtml();
    el.replaceWith(t.firstElementChild);
  }
}

function calNavM(d) {
  calSt.m += d;
  if (calSt.m < 0) { calSt.m = 11; calSt.y--; }
  else if (calSt.m > 11) { calSt.m = 0; calSt.y++; }
  calRedraw();
}

function calNavY(d) {
  calSt.y += d;
  calRedraw();
}

function calToggleSingle() {
  const ex = $('#calFloat'), bl = $('#kpBlur');
  if (ex) {
    ex.classList.add('closing');
    if (bl) bl.classList.remove('on');
    setTimeout(() => { if (ent) ent.calOpen = false; drawEnt(); }, 170);
    return;
  }
  const base = (ent && ent.d) || today();
  const [yy, mm] = base.split('-').map(Number);
  calSt = { mode: 'single', y: yy, m: mm - 1, d1: base, d2: '', tmp1: '', tmp2: '' };
  ent.calOpen = true;
  drawEnt();
}

function drawCalSheet(el, tgt) {
  const R = tgt === 'rs' ? rs : lf;
  const base = R.d1 || (tgt === 'rs' ? calc().k + '-01' : today());
  const [yy, mm] = base.split('-').map(Number);
  calSt = { mode: 'range', tgt, y: yy, m: mm - 1, d1: R.d1 || '', d2: R.d2 || '', tmp1: R.d1 || '', tmp2: R.d2 || '' };
  const s = $('#sheet');
  s.className = 'on';
  s.innerHTML = `<div class="sh kp cal-sh"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Selecionar período</h3><button class="x" onclick="cl()" aria-label="Fechar">✕</button></div>${buildCalHtml()}</div>`;
  s.dataset.k = 1;
  clearTimeout(cl.t);
  circ(true, el);
}

function calPick(iso) {
  if (calSt.mode === 'single') {
    ent.d = iso;
    calSt.d1 = iso;
    const ex = $('#calFloat'), bl = $('#kpBlur');
    if (ex) {
      ex.classList.add('closing');
      if (bl) bl.classList.remove('on');
      setTimeout(() => { ent.calOpen = false; drawEnt(); }, 170);
    } else {
      ent.calOpen = false;
      drawEnt();
    }
    return;
  }
  if (!calSt.tmp1 || (calSt.tmp1 && calSt.tmp2)) {
    calSt.tmp1 = iso;
    calSt.tmp2 = '';
  } else {
    if (iso < calSt.tmp1) { calSt.tmp2 = calSt.tmp1; calSt.tmp1 = iso; }
    else calSt.tmp2 = iso;
  }
  calRedraw();
}

function calApplyRng() {
  if (!calSt.tmp1) return;
  if (calSt.tgt === 'rs') {
    rs.d1 = calSt.tmp1;
    rs.d2 = calSt.tmp2 || calSt.tmp1;
    rs.c = '';
    rsCalClose();
    render();
    return;
  }
  lf.m = 'per';
  lf.d1 = calSt.tmp1;
  lf.d2 = calSt.tmp2 || calSt.tmp1;
  lf.p = -1;
  cl();
  render();
}

function calClearRng() {
  if (calSt.tgt === 'rs') {
    rs.d1 = '';
    rs.d2 = '';
    rs.c = '';
    rsCalClose();
    render();
    return;
  }
  lf.d1 = '';
  lf.d2 = '';
  lf.p = 7;
  cl();
  render();
}

let ent = null, pt = 'perfil';

function drawEnt() {
  const s = $('#sheet');
  const o = s.querySelector('.cats');
  const sl = o ? o.scrollLeft : 0;
  const c = calc();
  const v = (+ent.v || 0) / 100;
  const g = ent.t === 'g';
  const m = ent.t === 'm';
  const { M, sv, tv, hasT } = metaStat();
  s.className = 'on';

  const newS = sv + v;
  const pct = hasT ? Math.min(100, (newS / tv) * 100) : 0;
  const mBox = `<div class="mprog"><div class="gt"><b>${esc(M.t || 'Objetivo')}</b><span>${hasT ? Math.round(pct) + '%' : ''}</span></div><div class="sub">${brl(sv)}${v > 0 ? ` → <b>${brl(newS)}</b>` : ''}${hasT ? ' de ' + brl(tv) : ' guardados'}</div>${hasT ? `<div class="gb"><i style="width:${pct}%"></i></div>` : ''}</div>`;
  const dFmt = (ent.d || today()).split('-').reverse().join('/');
  const metaRow = m ? '' : `<div class="ent-meta"><button type="button" class="dt-btn" onclick="calToggleSingle()" aria-expanded="${!!ent.calOpen}">${ic('cal')}<span>${dFmt}</span></button><input type="text" placeholder="Descrição (opcional)" value="${esc(ent.n || '')}" oninput="ent.n=this.value"></div>`;
  const calOverlay = (!m && ent.calOpen)
    ? `<div id="kpBlur" class="kp-blur on" onclick="calToggleSingle()"></div><div id="calFloat" class="cal-float">${buildCalHtml()}</div>`
    : `<div id="kpBlur" class="kp-blur"></div>`;

  s.innerHTML = `<div class="sh kp">${calOverlay}
    <div style="display:flex;justify-content:space-between;align-items:center"><h3>${m ? 'Guardar no objetivo' : 'Novo lançamento'}</h3><button class="x" onclick="cl()" aria-label="Fechar">✕</button></div>
    ${m ? '' : `<div class="seg" style="grid-template-columns:repeat(3,1fr)">${[['g', 'Gasto'], ['r', 'Receita'], ['x', 'Fixo']].map((t) => `<button class="${ent.t === t[0] ? 'on' : ''}" onclick="ent.t='${t[0]}';ent.c=CT.${t[0]}[0][0];drawEnt()">${t[1]}</button>`).join('')}</div>`}
    <div class="amt">${sym()} ${v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
    ${m ? mBox : `<div class="sub">${g ? 'Pode gastar no mês' : ent.t === 'x' ? 'Fixos por mês' : 'Receitas no mês'}: <b>${brl(g ? c.sobra : ent.t === 'x' ? c.f : c.r)}</b></div>`}
    ${metaRow}
    ${m ? '' : `<div class="cats">${CT[ent.t].map((x) => `<button class="${ent.c === x[0] ? 'on' : ''}" onclick="ent.c='${x[0]}';drawEnt()"><i>${ic(x[1])}</i>${x[0]}</button>`).join('')}</div>`}
    <div class="qk">${[10, 20, 50, 100].map((n) => `<button onclick="kp('+${n}')">+${n}</button>`).join('')}</div>
    <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '00', 0, '⌫'].map((k) => `<button onclick="kp('${k}')">${k}</button>`).join('')}</div>
    <button class="pri" onclick="addTx()">${m ? 'Guardar' : g ? 'Salvar gasto' : ent.t === 'x' ? 'Salvar fixo' : 'Salvar receita'}</button>
  </div>`;
  const n = s.querySelector('.cats');
  if (n) n.scrollLeft = sl;
}

function kp(k) {
  let v = ent.v;
  if (k === '⌫') v = v.slice(0, -1);
  else if (k[0] === '+') v = String((+v || 0) + (+k.slice(1)) * 100);
  else v = (v + k).replace(/^0+/, '');
  if (v.length > 9) return;
  ent.v = v;
  drawEnt();
}

function addTx() {
  const v = Math.round(+ent.v || 0) / 100;
  if (!v) return;
  if (ent.t === 'm') { addMeta(v); cl(); return; }
  if (ent.t === 'x') S.fixos.push({ id: Date.now(), n: (ent.n || '').trim() || ent.c, v, ini: fxNow() });
  else S.tx.push({ id: Date.now(), t: ent.t, v, c: ent.c, n: (ent.n || '').trim(), d: ent.d || today() });
  save();
  ent.v = '';
  ent.n = '';
  render();
  drawEnt();
}

function foto(e) {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas');
      const s = Math.min(im.width, im.height);
      const z = 200;
      c.width = c.height = z;
      c.getContext('2d').drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, z, z);
      S.foto = c.toDataURL('image/jpeg', 0.8);
      save();
      render();
    };
    im.src = r.result;
  };
  r.readAsDataURL(f);
}

let lf = { m: 'per', p: 7, tp: '', ct: '', d1: '', d2: '' };

function lst() {
  const now = new Date();
  let a = S.tx.slice();
  if (lf.m === 'per') {
    if (lf.p === -1 && lf.d1) {
      const d2 = lf.d2 || lf.d1;
      a = a.filter((x) => x.d >= lf.d1 && x.d <= d2);
    } else if (lf.p) {
      const l = new Date(now);
      l.setDate(l.getDate() - lf.p + 1);
      const k = l.getFullYear() + '-' + String(l.getMonth() + 1).padStart(2, '0') + '-' + String(l.getDate()).padStart(2, '0');
      a = a.filter((x) => x.d >= k && x.d <= today());
    } else {
      a = a.filter((x) => x.d.startsWith(now.getFullYear() + '-'));
    }
  }
  if (lf.tp) a = a.filter((x) => x.t === lf.tp);
  if (lf.ct) a = a.filter((x) => x.c === lf.ct);
  return a.sort((x, z) => z.d.localeCompare(x.d) || z.id - x.id);

const rsMood = (c) => {
  const over = c.sobra < 0;
  const raw = c.base > 0 ? (c.sobra / c.base) * 100 : 0;
  const T = over ? 1 : (raw >= 65 || c.r - c.gast >= 500) ? 4 : raw >= 30 ? 3 : 2;
  return ['', 'sad', 'caut', 'happy', 'smart'][T];
};

function rsMeses() {
  if (!rs.d1) return [calc().k];
  const e = rs.d2 || rs.d1;
  const lo = rs.d1 <= e ? rs.d1 : e;
  const hi = rs.d1 <= e ? e : rs.d1;
  const o = [];
  for (let m = mi(lo.slice(0, 7)); m <= mi(hi.slice(0, 7)); m++) {
    const y = Math.floor(m / 12);
    const mm = m % 12;
    const k = y + '-' + String(mm + 1).padStart(2, '0');
    const last = k + '-' + String(new Date(y, mm + 1, 0).getDate()).padStart(2, '0');
    if (k + '-01' >= lo && last <= hi) o.push(k);
  }
  return o;
}

function rsDados() {
  const c = calc();
  const rg = !!rs.d1;
  const e0 = rs.d2 || rs.d1;
  const lo = rg ? (rs.d1 <= e0 ? rs.d1 : e0) : '';
  const hi = rg ? (rs.d1 <= e0 ? e0 : rs.d1) : '';
  const a = rg ? S.tx.filter((x) => x.t === 'g' && x.d >= lo && x.d <= hi) : c.t.filter((x) => x.t === 'g');
  const by = {};
  const ms = rsMeses();
  const fxl = S.fixos.map((f) => ({ f, n: ms.filter((k) => fxOn(f, k)).length })).filter((o) => o.n > 0);
  const fixT = fxl.reduce((s, o) => s + o.f.v * o.n, 0);
  a.forEach((x) => { const k = x.c || 'Outros'; by[k] = (by[k] || 0) + x.v; });
  if (fixT) by.Fixos = fixT;
  const e = Object.entries(by).sort((p, q) => q[1] - p[1]);
  const tot = e.reduce((s, x) => s + x[1], 0);
  const sel = rs.c && by[rs.c] ? rs.c : '';
  return { c, a, by, e, tot, sel, rg, lo, hi, fxl, mood: rsMood(c) };
}

function rsMv(d) { rs.d1 = ''; rs.d2 = ''; rs.c = ''; mv(d); }

function rsBarra(D) {
  const moRaw = D.c.d.toLocaleDateString('pt-BR', { month: 'long' });
  const moCap = moRaw[0].toUpperCase() + moRaw.slice(1);

    <button class="chip-ic${D.rg ? ' on' : ''}" onclick="rsCalOpen(this)" aria-label="Escolher período no calendário">${ic('cal')}</button>

}

const rsCol = (k) => CC[k] || CC.Outros;
const rsArc = (k, sel) => `stroke-width:${sel === k ? 33 : 28}px;opacity:${!sel || sel === k ? 1 : 0.32};cursor:pointer`;
const rsGl = (k, sel) => `stroke-width:30px;opacity:${sel === k ? 0.65 : 0}`;
const rsCap = (D) => `<div class="sub">${D.sel ? esc(D.sel) + ' · ' + Math.round((D.by[D.sel] / D.tot) * 100) + '%' : 'Total gasto'}</div><div style="text-align:center;font-size:26px;font-weight:800;letter-spacing:-1px">${brl(D.sel ? D.by[D.sel] : D.tot)}</div>`;

function rsRosca(D) {
  const { e, tot, sel } = D;
  let o = 0, arcs = '', gl = '';
  e.forEach(([k, v]) => {
    const p = (v / tot) * 100;
    const d = Math.max(p - 0.8, 0.1);
    const at = `cx="100" cy="100" r="70" fill="none" stroke="${rsCol(k)}" pathLength="100" stroke-dasharray="${d} ${100 - d}" stroke-dashoffset="${-o}" transform="rotate(-90 100 100)" data-k="${esc(k)}"`;
    const glAt = `cx="100" cy="100" r="74" fill="none" stroke="${rsCol(k)}" pathLength="100" stroke-dasharray="${d} ${100 - d}" stroke-dashoffset="${-o}" transform="rotate(-90 100 100)" data-k="${esc(k)}"`;
    gl += `<circle ${glAt} class="rsgl" style="${rsGl(k, sel)}" filter="url(#rsOutGlow)"/>`;
    arcs += `<circle ${at} style="${rsArc(k, sel)}" onclick="pk('${k}')"/>`;
    o += p;
  });
  return `<div class="card rs-card"><div style="position:relative;width:232px;margin:12px auto 6px;overflow:visible"><svg id="rsDonut" viewBox="0 0 200 200" style="width:232px;display:block;overflow:visible"><defs><mask id="rsOuterMask" maskUnits="userSpaceOnUse" x="-300" y="-300" width="800" height="800"><rect x="-300" y="-300" width="800" height="800" fill="#ffffff"/><circle cx="100" cy="100" r="84" fill="#000000"/></mask><filter id="rsOutGlow" filterUnits="userSpaceOnUse" x="-300" y="-300" width="800" height="800"><feGaussianBlur in="SourceGraphic" stdDeviation="6.5"/></filter></defs><g mask="url(#rsOuterMask)"><rect x="-300" y="-300" width="800" height="800" fill="transparent"/>${gl}</g>${arcs}</svg><div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none"><div class="pet ${D.mood}">${cat(D.mood, 84)}</div></div></div><div id="rsCap">${rsCap(D)}</div></div>`;
}

function rsSync() {
  const D = rsDados();
  const sel = D.sel;
  const grid = $('#app .rsg');
  if (grid) {
    const order = D.e.map(([k]) => k);
    if (sel) {
      const idx = order.indexOf(sel);
      if (idx > 0) { order.splice(idx, 1); order.unshift(sel); }
    }
    const map = new Map([...grid.querySelectorAll('.rsw')].map((w) => [w.dataset.k, w]));
    order.forEach((k) => {
      const w = map.get(k);
      if (!w) return;
      grid.appendChild(w);
      const on = k === sel;
      w.classList.toggle('on', on);
      w.classList.toggle('dim', !!sel && !on);
      const b = w.querySelector('.rsc');
      if (b) b.setAttribute('aria-pressed', on);
    });
  }

function circ(o, el) {

  const q = p.getBoundingClientRect();

function openFix() {
  const ev = window.event;
  const el = ev && ev.currentTarget && ev.currentTarget.getBoundingClientRect ? ev.currentTarget : null;
  fx = fxNovo();
  clearTimeout(cl.t);
  drawFix();
  $('#sheet').dataset.k = 1;
  circ(true, el);
}
function fxk(k) {
  let v = fx.v;
  if (k === '⌫') v = v.slice(0, -1);
  else if (k[0] === '+') v = String((+v || 0) + (+k.slice(1)) * 100);
  else v = (v + k).replace(/^0+/, '');
  if (v.length > 9) return;
  fx.v = v;
  drawFix();
}
function fxQ(d) { fx.q = Math.max(1, Math.min(120, fx.q + d)); drawFix(); }
function fxEdit(id) {
  const x = S.fixos.find((t) => t.id === id);
  if (!x) return;
  fx = { v: String(Math.round(x.v * 100)), n: x.n, p: x.parc ? 1 : 0, q: x.parc ? Math.max(1, fxRem(x)) : 12, id: x.id, view: 'f' };
  drawFix();
}
function drawFix() {
  const s = $('#sheet'), c = calc();
  s.className = 'on';
  const hd = (t, r) => `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3>${t}</h3><span style="display:flex;align-items:center;gap:8px">${r}<button class="x" onclick="cl()" aria-label="Fechar">✕</button></span></div>`;
  if (fx.view === 'l') {
    const parcs = S.fixos.filter((x) => x.parc);
    const mens = S.fixos.filter((x) => !x.parc);
    const nextMonths = [1, 2, 3].map((step) => {
      const d = new Date(c.d.getFullYear(), c.d.getMonth() + step, 1);
      const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      const mName = d.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '');
      const val = S.fixos.filter((x) => fxOn(x, k)).reduce((sum, x) => sum + x.v, 0);
      return { lbl: mName[0].toUpperCase() + mName.slice(1), val };
    });

    const renderParc = (x) => {
      const rem = fxRem(x);
      const paid = Math.max(0, Math.min(x.parc.n, x.parc.n - rem + 1));
      const pct = Math.round((paid / x.parc.n) * 100);
      const restVal = Math.max(0, rem) * x.v;
      const statusTxt = rem > 1
        ? `Parcela ${paid} de ${x.parc.n} · faltam ${brl(restVal)}`
        : rem === 1
          ? `Última parcela (${x.parc.n}/${x.parc.n})`
          : `Encerrado (${x.parc.n}/${x.parc.n})`;
      const canAdvance = rem > 0;
      return `<div class="fx-item">
        <div class="fx-item-top">
          <div class="fx-item-info">
            <b>${esc(x.n)}${rem === 1 ? '<span class="fx-tag">Última</span>' : ''}</b>
            <em>${statusTxt}</em>
          </div>
          <div class="fx-item-acts">
            <div class="fx-item-main">
              <b>${brl(x.v)}</b>
              <button type="button" onclick="fxEdit(${x.id})" aria-label="Editar">✎</button>
              <button type="button" onclick="delFix(${x.id})" aria-label="Apagar">✕</button>
            </div>
            ${canAdvance ? `<button type="button" class="fx-adv" onclick="advanceParc(${x.id})" aria-label="Adiantar parcela de ${esc(x.n)}">Adiantar</button>` : ''}
          </div>
        </div>
        <div class="fx-bar"><i style="width:${pct}%"></i></div>
      </div>`;
    };

    const renderMen = (x) => `<div class="fx-item">
      <div class="fx-item-top">
        <div class="fx-item-info">
          <b>${esc(x.n)}</b>
          <em>Todo mês · desde ${fxMo(x).split('-').reverse().join('/')}</em>
        </div>
        <div class="fx-item-acts">
          <div class="fx-item-main">
            <b>${brl(x.v)}</b>
            <button onclick="fxEdit(${x.id})" aria-label="Editar">✎</button>
            <button onclick="delFix(${x.id})" aria-label="Apagar">✕</button>
          </div>
        </div>
      </div>
    </div>`;

    const prevBox = S.fixos.length
      ? `<div class="fx-prev"><div style="font-size:12px;font-weight:700">Previsão dos próximos meses</div>${nextMonths.map((m) => `<div class="fx-prev-row"><span>${m.lbl}</span><b>${brl(m.val)}</b></div>`).join('')}</div>`
      : '';

    const bodyList = S.fixos.length
      ? `${prevBox}
        ${parcs.length ? `<div class="fx-grp"><h5>${ic('card')}Parcelados (${parcs.length})</h5>${parcs.map(renderParc).join('')}</div>` : ''}
        ${mens.length ? `<div class="fx-grp"><h5>${ic('rep')}Fixos mensais (${mens.length})</h5>${mens.map(renderMen).join('')}</div>` : ''}`
      : '<p class="sub">Aluguel, internet, assinaturas e parcelas do cartão. Contam todo mês.</p>';

    s.innerHTML = `<div class="sh kp">${hd('Fixos cadastrados', '')}<div class="sub">Neste mês: <b>${brl(c.f)}</b></div>${bodyList}<button class="pri" onclick="fx=fxNovo();drawFix()">Novo fixo</button></div>`;
    return;
  }
  const v = (+fx.v || 0) / 100;
  const par = !!fx.p;
  const tot = Math.round(v * fx.q * 100) / 100;
  s.innerHTML = `<div class="sh kp">${hd(fx.id ? 'Editar fixo' : 'Gastos fixos', `<button class="chip" onclick="fx.view='l';drawFix()">Cadastrados · ${S.fixos.length}</button>`)}
  <div class="seg">${[[0, 'Mensal'], [1, 'Parcelado']].map((t) => `<button class="${(fx.p ? 1 : 0) === t[0] ? 'on' : ''}" onclick="fx.p=${t[0]};drawFix()">${t[1]}</button>`).join('')}</div>
  <div class="amt">${sym()} ${v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
  <div class="sub">${par ? (v > 0 ? `${fx.q}x de <b>${brl(v)}</b> = <b>${brl(tot)}</b>` : 'Valor da parcela') : `Fixos por mês: <b>${brl(c.f)}</b>`}</div>
  <div class="ent-meta" style="grid-template-columns:1fr"><input type="text" placeholder="${par ? 'Compra (ex.: Celular)' : 'Nome (ex.: Internet)'}" value="${esc(fx.n || '')}" oninput="fx.n=this.value"></div>
  ${par ? `<div class="fxq"><button class="x" onclick="fxQ(-1)" aria-label="Menos uma parcela">−</button><div><b>${fx.q}</b> parcela${fx.q === 1 ? '' : 's'} restante${fx.q === 1 ? '' : 's'}<em>última em ${fxFim(fxNow(), fx.q)}</em></div><button class="x" onclick="fxQ(1)" aria-label="Mais uma parcela">+</button></div>` : ''}
  <div class="qk">${[10, 20, 50, 100].map((n) => `<button onclick="fxk('+${n}')">+${n}</button>`).join('')}</div>
  <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '00', 0, '⌫'].map((k) => `<button onclick="fxk('${k}')">${k}</button>`).join('')}</div>
  <button class="pri" onclick="addFix()">${fx.id ? 'Salvar alterações' : par ? 'Adicionar parcelado' : 'Adicionar fixo'}</button></div>`;
}
function addFix() {
  const v = Math.round(+fx.v || 0) / 100;
  if (!v) return;
  const par = !!fx.p, ed = !!fx.id, i = S.fixos.findIndex((x) => x.id === fx.id), old = ed && i >= 0 ? S.fixos[i] : null;
  const o = { id: fx.id || Date.now(), n: (fx.n || '').trim() || (par ? 'Parcelado' : 'Fixo'), v, ini: old && !par && !old.parc ? fxMo(old) : fxNow() };
  if (par) o.parc = { n: fx.q, ini: fxNow() };
  if (ed && i >= 0) S.fixos[i] = o;
  else S.fixos.push(o);
  save();
  toast(ed ? 'Fixo atualizado' : par ? 'Parcelado adicionado' : 'Fixo adicionado');
  fx = fxNovo(fx.p, fx.q);
  if (ed) fx.view = 'l';
  render();
  drawFix();
}
function advanceParc(id) {
  const idx = S.fixos.findIndex((x) => x.id === id);
  if (idx < 0) return;
  const x = S.fixos[idx];
  if (!x.parc) return;
  const rem = fxRem(x);
  if (rem <= 0) return;

  const advAnt = x.parc.adv || 0;
  const totalParc = x.parc.n + advAnt;
  const newRem = rem - 1;

  if (newRem <= 0) {
    S.fixos.splice(idx, 1);
  } else {
    x.parc = { n: x.parc.n - 1, ini: x.parc.ini, adv: advAnt + 1 };
  }

  S.tx.push({
    id: Date.now(),
    t: 'g',
    v: x.v,
    c: 'Outros',
    n: `Adiantamento: ${x.n} (${totalParc - newRem}/${totalParc})`,
    d: today()
  });

  save();
  fx = null;
  cl();
  showAdvanceCelebration(x.n, x.v, newRem, totalParc);
}
function delFix(id) { S.fixos = S.fixos.filter((x) => x.id !== id); save(); render(); drawFix(); }
function del(id) { S.tx = S.tx.filter((x) => x.id !== id); save(); render(); }

function cp() {
  const t = $('#bk');
  if (!t) return;
  t.select();
  try {
    document.execCommand('copy');
    toast('Backup copiado');
  } catch (err) {
    toast('Não foi possível copiar automaticamente');
  }
}

function imp() {
  try {
    const o = JSON.parse($('#bk').value);
    if (!Array.isArray(o.tx)) throw new Error('Formato inválido');
    S = Object.assign({ onb: 1, limite: 1000, tx: [], fixos: [] }, o);
    save();
    view = 'home';
    render();
    toast('Backup restaurado');
  } catch (err) {
    toast('Backup inválido');
  }
}

function idle() {
  const e = document.querySelector('.m');
  if (e) {
    const a = ['hop', 'tilt', 'wig', 'spin', 'jig', 'pop'];
    e.className = 'm';
    void e.offsetWidth;
    e.classList.add(a[Math.floor(Math.random() * a.length)]);
  }
  setTimeout(idle, 1600 + Math.random() * 2600);
}

/* ==========================================================================
   GESTOS DE ARRASTE, SWIPE, OLHAR DO PET E NAVEGAÇÃO ENTRE ABAS
   ========================================================================== */
(() => {
  let d = null, mvFlag = 0;
  document.addEventListener('pointerdown', (e) => {
    mvFlag = 0;
    const c = e.target.closest('.cats');
    if (c && e.pointerType === 'mouse') d = { c, x: e.clientX, s: c.scrollLeft };
  });
  document.addEventListener('pointermove', (e) => {
    if (!d) return;
    const dx = e.clientX - d.x;
    if (Math.abs(dx) > 4) mvFlag = 1;
    d.c.scrollLeft = d.s - dx;
  });
  document.addEventListener('pointerup', () => { d = null; });
  document.addEventListener('click', (e) => {
    if (mvFlag) { e.stopPropagation(); e.preventDefault(); mvFlag = 0; }
  }, true);
})();

(() => {
  let s = null;
  window.__sw = 0;
  document.addEventListener('pointerdown', (e) => {
    window.__sw = 0;
    const c = e.target.closest('.sw .lc');
    document.querySelectorAll('.lc.o').forEach((n) => {
      if (n.closest('.sw') !== e.target.closest('.sw')) {
        n.style.transform = '';
        n.classList.remove('o');
        n.dataset.o = 0;
      }
    });
    if (c) s = { c, x: e.clientX, y: e.clientY, b: +c.dataset.o || 0, m: 0, v: +c.dataset.o || 0 };
  });
  document.addEventListener('pointermove', (e) => {
    if (!s) return;
    const dx = e.clientX - s.x, dy = e.clientY - s.y;
    if (!s.m && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) s.m = 1;
    if (s.m) {
      const P_ = s.c.parentNode;
      const lo = P_.querySelector('.sa.r') ? -150 : 0;
      const hi = P_.querySelector('.sa.l') ? 150 : 0;
      s.v = Math.max(lo, Math.min(hi, s.b + dx));
      s.c.parentNode.classList.toggle('go', Math.abs(s.v) > 110);
      s.c.style.transition = 'none';
      s.c.style.transform = `translateX(${s.v}px)`;
    }
  });
  const end = () => {
    if (!s) return;
    const c = s.c;
    c.style.transition = '';
    if (s.m) {
      c.parentNode.classList.remove('go');
      if (Math.abs(s.v) > 110) {
        c.parentNode.querySelector(s.v > 0 ? '.sa.l' : '.sa.r').click();
        s = null;
        window.__sw = 1;
        return;
      }
      const o = Math.abs(s.v) > 38 ? (s.v > 0 ? 76 : -76) : 0;
      c.style.transform = o ? `translateX(${o}px)` : '';
      c.dataset.o = o;
      c.classList.toggle('o', !!o);
      window.__sw = 1;
    } else if (+c.dataset.o) {
      c.style.transform = '';
      c.dataset.o = 0;
      c.classList.remove('o');
      window.__sw = 1;
    }
    s = null;
  };
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
  document.addEventListener('click', (e) => {
    if (window.__sw) { e.stopPropagation(); e.preventDefault(); window.__sw = 0; }
  }, true);
})();

(() => {
  let on = false, t = null;
  const root = document.documentElement;
  const look = (x, y) => {
    const f = document.querySelector('.face');
    if (!f) return;
    const r = f.getBoundingClientRect();
    const dx = x - (r.left + r.width / 2);
    const dy = y - (r.top + r.height / 2);
    const dist = Math.hypot(dx, dy) || 1;
    const k = Math.min(1, dist / 140);
    root.style.setProperty('--fx', ((dx / dist) * 9 * k).toFixed(1) + 'px');
    root.style.setProperty('--fy', ((dy / dist) * 6 * k).toFixed(1) + 'px');
  };
  const rest = () => {
    root.style.setProperty('--fx', '0px');
    root.style.setProperty('--fy', '0px');
  };
  document.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'mouse' || on) look(e.clientX, e.clientY);
  });
  document.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'mouse' && !e.target.closest('input,textarea,select')) {
      clearTimeout(t);
      t = setTimeout(() => { on = true; window.__sw = 1; look(e.clientX, e.clientY); }, 350);
    }
  });
  const rel = () => {
    clearTimeout(t);
    if (on) { on = false; setTimeout(rest, 700); }
  };
  document.addEventListener('pointerup', rel);
  document.addEventListener('pointercancel', rel);
  document.addEventListener('touchmove', (e) => { if (on) e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', (e) => { if (on) e.preventDefault(); });
})();

addEventListener('scroll', () => {
  const m = document.querySelector('.mini');
  if (m) m.classList.toggle('on', scrollY > 320);
}, { passive: true });

$('#sheet').addEventListener('click', (e) => {
  if (e.target.id === 'sheet') cl();
});

(() => {
  let s = null;
  document.addEventListener('pointerdown', (e) => {
    s = null;
    const g = e.target.closest('.ring .garc');
    if (!g || (e.pointerType === 'mouse' && e.button)) return;
    s = { g, in: g.querySelector('.garc-inner'), x: e.clientX, y: e.clientY, m: 0, dy: 0 };
  });
  document.addEventListener('pointermove', (e) => {
    if (!s) return;
    const dx = e.clientX - s.x, dy = e.clientY - s.y;
    if (!s.m) {
      if (dy > 6 && dy > Math.abs(dx) * 1.1) {
        s.m = 1;
        s.g.style.transition = 'none';
        if (s.in) s.in.setAttribute('mask', 'url(#gmask)');
      } else if (Math.abs(dx) > 12 || dy < -10) {
        s = null;
        return;
      }
    }
    if (s && s.m) {
      s.dy = Math.max(0, Math.min(72, dy));
      const k = s.dy / 72;
      s.g.style.transform = `translate3d(0,${(s.dy * 0.35).toFixed(1)}px,0) scale(${(1 - k * 0.16).toFixed(3)},${(1 - k * 0.26).toFixed(3)})`;
      s.g.style.opacity = Math.max(0, 1 - k * 1.15).toFixed(2);
    }
  });
  const end = (x) => {
    if (!s) return;
    const { g, dy, m } = s, inn = s.in;
    s = null;
    if (!m) return;
    window.__sw = 1;
    if (!x && dy > 38) {
      g.style.transition = 'transform 0.24s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.2s ease-out';
      g.style.transform = 'translate3d(0,26px,0) scale(0.76,0.54)';
      g.style.opacity = '0';
      setTimeout(() => gPin(0, 1), 210);
    } else {
      g.style.transition = 'transform 0.36s cubic-bezier(0.22, 1.35, 0.36, 1), opacity 0.25s ease';
      g.style.transform = '';
      g.style.opacity = '';
      setTimeout(() => { if (inn && !g.style.transform) inn.removeAttribute('mask'); }, 360);
    }
  };
  document.addEventListener('pointerup', () => end(0));
  document.addEventListener('pointercancel', () => end(1));
})();

(() => {
  let s = null;
  document.addEventListener('pointerdown', (e) => {
    s = null;
    const c = e.target.closest('.gm .gmi');
    if (!c || (e.pointerType === 'mouse' && e.button)) return;
    s = { c, w: c.parentNode, x: e.clientX, y: e.clientY, m: 0, v: 0 };
  });
  document.addEventListener('pointermove', (e) => {
    if (!s) return;
    const dx = e.clientX - s.x, dy = e.clientY - s.y;
    if (!s.m) {
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.2) {
        s.m = 1;
        s.c.style.transition = 'none';
      } else if (Math.abs(dy) > 10) {
        s = null;
        return;
      }
    }
    if (s && s.m) {
      s.v = dx;
      s.c.style.transform = `translate3d(${dx}px,0,0)`;
      s.c.style.opacity = 1 - Math.min(0.35, Math.abs(dx) / 320);
      s.w.classList.toggle('swl', dx > 12);
      s.w.classList.toggle('swr', dx < -12);
      s.w.classList.toggle('go', Math.abs(dx) > 80);
    }
  });
  const end = (x) => {
    if (!s) return;
    const { c, w, v, m } = s;
    s = null;
    if (!m) return;
    window.__sw = 1;
    w.classList.remove('swl', 'swr', 'go');
    if (!x && Math.abs(v) > 80) {
      c.style.transition = 'transform 0.24s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.24s';
      c.style.transform = v > 0 ? 'translate3d(30%,0,0) scale(0.3)' : 'translate3d(-125%,0,0)';
      c.style.opacity = '0';
      setTimeout(() => v > 0 ? gPin(1) : gDismiss(), 230);
    } else {
      c.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.25s';
      c.style.transform = '';
      c.style.opacity = '';
    }
  };
  document.addEventListener('pointerup', () => end(0));
  document.addEventListener('pointercancel', () => end(1));
})();

(() => {
  const T = ['home', 'list', 'resumo', 'dicas'];
  const L = '.cats,.sw,.gm,.garc,.tdots,.cal-box,input,textarea,select,.nav,.av,.mon,#sheet';
  let s = null;
  const ns = () => { document.body.style.userSelect = document.body.style.webkitUserSelect = ''; };
  document.addEventListener('pointerdown', (e) => {
    s = null;
    if (!S.onb || $('#sheet').className || T.indexOf(view) < 0 || (e.pointerType === 'mouse' && e.button) || e.target.closest(L)) return;
    s = { x: e.clientX, y: e.clientY, t: Date.now(), m: 0 };
  });
  document.addEventListener('pointermove', (e) => {
    if (!s) return;
    if (window.__sw) { s = null; ns(); return; }
    const dx = e.clientX - s.x, dy = e.clientY - s.y;
    if (s.m) return;
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { s = null; return; }
    if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.4) {
      s.m = 1;
      document.body.style.userSelect = document.body.style.webkitUserSelect = 'none';
    }
  });
  document.addEventListener('pointerup', (e) => {
    if (!s) return;
    const { x, t, m } = s, dx = e.clientX - x, dt = Math.max(1, Date.now() - t);
    s = null;
    ns();
    if (!m) return;
    window.__sw = 1;
    if (Math.abs(dx) > 70 || (Math.abs(dx) > 40 && Math.abs(dx) / dt > 0.45)) {
      const n = T[T.indexOf(view) + (dx < 0 ? 1 : -1)];
      if (n) go(n);
    }
  });
  document.addEventListener('pointercancel', () => { s = null; ns(); });
})();

applyTheme();
render();
idle();
</script>
